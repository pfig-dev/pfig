[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pfig"
dynamic = ["version"]
description = "A tiny, strict DSL for declarative object configuration"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "pfig maintainers", email = "maintainers@pfig.dev" },
]
keywords = [
    "configuration",
    "config",
    "dsl",
    "machine-learning",
    "ml",
    "reproducibility",
    "dependency-injection",
    "wiring",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Systems Administration",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
remote = [
    "fsspec>=2023.1.0",
    "gcsfs>=2023.1.0",
    "s3fs>=2023.1.0",
]
lsp = [
    "pygls>=1.3.0,<2.0.0",
    "lsprotocol>=2023.0.1,<2024.0.0",
    "jedi>=0.19.0",
]
dev = [
    "tox>=4.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff==0.15.16",
    "pyright>=1.1.0",
    "pre-commit>=3.0.0",
    "build>=1.0.0",
]
docs = [
    "mkdocs>=1.5.0,<2.0",
    "mkdocs-material>=9.0.0",
    "pymdown-extensions>=10.0.0,<12.0.0",
    "mkdocstrings[python]>=0.24.0",
]
vis = []

[project.scripts]
pfig = "pfig.cli:main"
pfig-lsp = "pfig.lsp.__main__:main"

[project.urls]
Repository = "https://github.com/pfig-dev/pfig"
Documentation = "https://pfig.dev/"
Homepage = "https://pfig.dev/"
Issues = "https://github.com/pfig-dev/pfig/issues"
Changelog = "https://github.com/pfig-dev/pfig/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["pfig", "pfig.*"]

[tool.setuptools.package-data]
pfig = ["py.typed", "rules/*.md", "vis/assets/*", "vis/assets/assets/*"]

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["I"]

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py310, py311, py312, py313

[testenv]
extras = dev,remote,lsp
commands = pytest {posargs}
"""

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
