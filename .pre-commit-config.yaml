repos:
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
    -   id: ruff-check
        args: [--fix]
    -   id: ruff-format
-   repo: local
    hooks:
    -   id: pyright
        name: pyright
        entry: pyright
        language: system
        pass_filenames: false
    -   id: webview-check
        name: webview tests and build
        entry: bash -c 'cd webview && npm ci && npm run test && npm run build && git -C .. diff --exit-code -- pfig/vis/assets'
        language: system
        pass_filenames: false
        files: ^(webview/|pfig/vis/assets/)
